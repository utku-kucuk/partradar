# Local development services. Spring Boot starts these automatically (spring-boot-docker-compose).
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: partradar
      POSTGRES_USER: partradar
      POSTGRES_PASSWORD: partradar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partradar"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    labels:
      org.springframework.boot.ignore: true

volumes:
  postgres-data:
