name: Feature
description: Propose a new capability
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user story
      placeholder: As a <role>, I want <capability> so that <outcome>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
