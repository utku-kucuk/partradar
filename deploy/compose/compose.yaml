# Local development environment.
#
#   make infra-up   infrastructure only, run services from the IDE or with `make run`
#   make up         infrastructure + all services as containers (profile "apps")
#
# Host ports
#   8080 api-gateway   8081 shop   8082 inquiry   8083 notification
#   5432 PostgreSQL    9092 Kafka  8085 Kafka UI  5672/15672 RabbitMQ
#   8180 Keycloak      8025 Mailpit  3001 Grafana  4317/4318 OTLP

name: partradar

x-service: &service
  profiles: [apps]
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  restart: unless-stopped
  environment: &service-env
    SPRING_PROFILES_ACTIVE: prod
    DATABASE_USERNAME: partradar
    DATABASE_PASSWORD: partradar

services:
  # --- Infrastructure --------------------------------------------------------

  postgres:
    # Multi-arch build of the official PostGIS image (postgis/postgis is amd64 only),
    # published by a maintainer of the postgis/docker-postgis project.
    image: imresamu/postgis:17-3.6
    environment:
      POSTGRES_DB: partradar
      POSTGRES_USER: partradar
      POSTGRES_PASSWORD: partradar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partradar -d partradar"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers (kafka:29092), EXTERNAL for the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      retries: 15

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: partradar
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: partradar
      RABBITMQ_DEFAULT_PASS: partradar
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; query the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 10s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      retries: 10

  # Grafana + Prometheus + Loki + Tempo behind one OpenTelemetry collector.
  lgtm:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"

  # --- Services (profile "apps") ---------------------------------------------

  api-gateway:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      <<: *service-env
      SHOP_SERVICE_URL: http://shop-service:8081
      INQUIRY_SERVICE_URL: http://inquiry-service:8082
    ports:
      - "8080:8080"
    depends_on:
      - shop-service
      - inquiry-service

  shop-service:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: shop-service
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/shop
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  inquiry-service:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: inquiry-service
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/inquiry
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: notification-service
    ports:
      - "8083:8083"

volumes:
  postgres-data:
  kafka-data:
  rabbitmq-data:
