apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: partradar
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/utku-kucuk/partradar.git
    targetRevision: main
    path: deploy/helm/partradar
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: partradar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
