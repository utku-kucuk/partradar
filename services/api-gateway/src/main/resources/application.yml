spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          # X-Forwarded-* headers are only added for requests from trusted proxies:
          # loopback and private networks (container network, cluster ingress).
          trusted-proxies: "127\\..*|10\\..*|172\\.(1[6-9]|2[0-9]|3[01])\\..*|192\\.168\\..*|0:0:0:0:0:0:0:1|::1"
          routes:
            - id: shop-service
              uri: ${SHOP_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/shops/**
            - id: inquiry-service
              uri: ${INQUIRY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/inquiries/**

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Runs behind the gateway / ingress: build links from X-Forwarded-* headers.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, gateway
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
