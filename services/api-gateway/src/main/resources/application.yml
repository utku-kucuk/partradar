spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: shop-service
              uri: ${SHOP_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/shops/**
            - id: inquiry-service
              uri: ${INQUIRY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/inquiries/**

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, gateway
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
