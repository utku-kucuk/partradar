spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued by Keycloak; signing keys are discovered lazily on the first request.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/partradar}

server:
  port: ${PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: notification-service
    description: Delivers notifications to customers and shops

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
