spring:
  application:
    name: shop-service
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued by Keycloak; signing keys are discovered lazily on the first request.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/partradar}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DATABASE_USERNAME:partradar}
    password: ${DATABASE_PASSWORD:partradar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      republish-outstanding-events-on-restart: true

server:
  port: ${PORT:8081}
  shutdown: graceful
  # Runs behind the gateway / ingress: build links from X-Forwarded-* headers.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: shop-service
    description: Shops, locations and routing of inquiries to nearby shops

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
